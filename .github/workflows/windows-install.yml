name: Windows installation smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: curl, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, zip
          coverage: none
      - name: Install and run in a fresh folder using Windows PowerShell
        shell: powershell
        run: ./scripts/smoke-windows-install.ps1
